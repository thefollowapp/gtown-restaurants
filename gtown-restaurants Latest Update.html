<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Germantown Area Chamber of Commerce - Restaurants</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --hunter:#123524; --hunter-dark:#0B241A; --kelly:#3C9F52; --kelly-light:#6FC96C; --kelly-pale:#E8F5E9; --bg:#F4F7F2; --card:#FFFFFF; --ink:#16261E; --ink-soft:#4B5D53; --line:#DCE6DD; --radius:16px; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; background:var(--bg); color:var(--ink); font-family:'Public Sans',sans-serif; overflow:hidden; -webkit-user-select:none; user-select:none; }
  #app { display:flex; flex-direction:column; height:100vh; width:100vw; }
  header { background:var(--hunter); color:white; padding:22px 32px; display:flex; align-items:center; gap:24px; flex-shrink:0; border-bottom:6px solid var(--kelly); }
  .brand { font-family:'Archivo',sans-serif; font-weight:800; font-size:26px; letter-spacing:0.5px; white-space:nowrap; cursor:pointer; display:flex; align-items:center; gap:10px; }
  .brand .dot { width:12px; height:12px; border-radius:50%; background:var(--kelly-light); }
  .searchwrap { flex:1; position:relative; }
  #searchInput { width:100%; font-size:22px; font-family:'Public Sans',sans-serif; padding:14px 20px 14px 52px; border-radius:999px; border:none; outline:none; background:white; color:var(--ink); caret-color:transparent; }
  .searchicon { position:absolute; left:20px; top:50%; transform:translateY(-50%); width:22px; height:22px; opacity:0.5; pointer-events:none; }
  .clearbtn { position:absolute; right:10px; top:50%; transform:translateY(-50%); width:36px; height:36px; border-radius:50%; border:none; background:var(--bg); color:var(--ink-soft); font-size:20px; display:none; align-items:center; justify-content:center; cursor:pointer; }
  .homebtn { background:var(--kelly); color:white; border:none; padding:14px 22px; border-radius:999px; font-family:'Public Sans',sans-serif; font-weight:700; font-size:18px; cursor:pointer; white-space:nowrap; }
  main { flex:1; overflow:hidden; position:relative; }
  .view { position:absolute; inset:0; overflow-y:auto; padding:32px; display:none; }
  .view.active { display:block; }
  .sectionlabel { font-family:'Archivo',sans-serif; font-weight:700; font-size:15px; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink-soft); margin:0 0 18px 4px; }
  .categorygrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:20px; }
  .catsign { background:var(--hunter); border:3px solid var(--kelly-light); border-radius:10px; padding:26px 22px; cursor:pointer; position:relative; min-height:120px; display:flex; flex-direction:column; justify-content:center; }
  .catsign::before,.catsign::after { content:''; position:absolute; width:8px; height:8px; border-radius:50%; background:var(--kelly-light); top:10px; }
  .catsign::before { left:10px; } .catsign::after { right:10px; }
  .catname { font-family:'Archivo',sans-serif; font-weight:800; font-size:24px; color:white; text-transform:uppercase; letter-spacing:0.5px; line-height:1.15; }
  .catcount { font-size:15px; color:var(--kelly-light); margin-top:8px; font-weight:600; }
  .listheader { display:flex; align-items:center; gap:14px; margin-bottom:20px; }
  .backbtn { background:var(--card); border:2px solid var(--line); color:var(--ink); padding:12px 18px; border-radius:999px; font-weight:700; font-size:16px; cursor:pointer; flex-shrink:0; }
  .listtitle { font-family:'Archivo',sans-serif; font-weight:800; font-size:28px; color:var(--hunter); text-transform:uppercase; }
  .letterhead { font-family:'Archivo',sans-serif; font-weight:800; font-size:16px; color:var(--kelly); background:var(--kelly-pale); padding:6px 14px; border-radius:6px; display:inline-block; margin:22px 0 10px 0; }
  .bizrow { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; cursor:pointer; }
  .bizrow:active { background:var(--kelly-pale); }
  .bizname { font-size:19px; font-weight:600; color:var(--ink); }
  .bizcat { font-size:14px; color:var(--ink-soft); margin-top:2px; }
  .bizarrow { font-size:22px; color:var(--kelly); }
  .emptystate { text-align:center; padding:60px 20px; color:var(--ink-soft); font-size:18px; }
  .overlay { position:fixed; inset:0; background:rgba(11,36,26,0.55); display:none; align-items:center; justify-content:center; z-index:50; padding:24px; }
  .overlay.active { display:flex; }
  .detailcard { background:var(--card); border-radius:var(--radius); padding:34px; max-width:520px; width:100%; max-height:80vh; overflow-y:auto; border-top:8px solid var(--kelly); }
  .detailname { font-family:'Archivo',sans-serif; font-weight:800; font-size:26px; color:var(--hunter); margin:0 0 4px; }
  .detailcat { font-size:15px; color:var(--kelly); font-weight:700; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:18px; }
  .detailrow { display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-top:1px solid var(--line); font-size:17px; }
  .detailrow:first-of-type { border-top:none; }
  .detaillabel { color:var(--ink-soft); min-width:90px; font-weight:600; }
  .closebtn { margin-top:24px; width:100%; padding:16px; background:var(--hunter); color:white; border:none; border-radius:999px; font-weight:700; font-size:18px; cursor:pointer; }
  #keyboard { position:fixed; left:0; right:0; bottom:0; background:var(--hunter-dark); padding:14px; display:none; z-index:60; border-top:4px solid var(--kelly); }
  #keyboard.active { display:block; }
  .kbrow { display:flex; justify-content:center; gap:6px; margin-bottom:6px; }
  .kbkey { background:#26433380; border:none; color:white; font-family:'Public Sans',sans-serif; font-size:20px; font-weight:600; padding:14px 0; border-radius:8px; cursor:pointer; flex:1; max-width:60px; text-transform:uppercase; }
  .kbkey.wide { max-width:140px; } .kbkey.space { max-width:none; flex:3; } .kbkey.done { background:var(--kelly); max-width:100px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand" onclick="goHome()"><span class="dot"></span>Restaurants</div>
    <div class="searchwrap">
      <svg class="searchicon" viewBox="0 0 24 24" fill="none" stroke="#123524" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="searchInput" placeholder="Search for a business" readonly onclick="openKeyboard()">
      <button class="clearbtn" id="clearBtn" onclick="clearSearch()">&times;</button>
    </div>
    <button class="homebtn" onclick="goHome()">Home</button>
  </header>
  <main>
    <div class="view active" id="view-home">
      <div class="sectionlabel">Browse by category</div>
      <div class="categorygrid" id="categoryGrid"></div>
    </div>
    <div class="view" id="view-list">
      <div class="listheader">
        <button class="backbtn" onclick="goHome()">&larr; Back</button>
        <div class="listtitle" id="listTitle"></div>
      </div>
      <div id="listContent"></div>
    </div>
  </main>
  <div class="overlay" id="detailOverlay" onclick="if(event.target===this) closeDetail()">
    <div class="detailcard" id="detailCard"></div>
  </div>
  <div id="keyboard">
    <div class="kbrow" id="kbrow1"></div>
    <div class="kbrow" id="kbrow2"></div>
    <div class="kbrow" id="kbrow3"></div>
    <div class="kbrow" id="kbrow4"></div>
    <div class="kbrow">
      <button class="kbkey space" onclick="kbType(' ')">space</button>
      <button class="kbkey wide" onclick="kbBackspace()">delete</button>
      <button class="kbkey done" onclick="closeKeyboard()">done</button>
    </div>
  </div>
</div>

. Byhalia Rd.","phone":"(901) 853-4702"},{"id":"b455","name":"Rock'N Dough Pizza & Brewery","category":"Restaurants & Food","subcategory":"Restaurants","address":"7850 Poplar Ave., #6","phone":"(901) 779-2008"},{"id":"b463","name":"Salad Station","category":"Restaurants & Food","subcategory":"Restaurants","address":"9155 Poplar Ave., Ste 21","phone":"(901) 497-2120"},{"id":"b491","name":"Southern Social","category":"Restaurants & Food","subcategory":"Restaurants","address":"2285 S. Germantown Rd.","phone":"(901) 754-5555"},{"id":"b502","name":"Stoney River Steakhouse & Grill","category":"Restaurants & Food","subcategory":"Restaurants","address":"7515 Poplar Ave","phone":"(901) 207-1100"},{"id":"b508","name":"Sufi's Mediterranean Grill & Bar","category":"Restaurants & Food","subcategory":"Restaurants","address":"7609 Poplar Pike","phone":"(901) 779-2201"},{"id":"b509","name":"Sugar Ghost Ice Cream and Bubble Tea","category":"Restaurants & Food","subcategory":"Ice Cream, Yogurt, Juice Bars & Smoothies","address":"9077 Poplar Avenue, Suite 103","phone":"(901) 646-6711"},{"id":"b515","name":"TCBY Germantown","category":"Restaurants & Food","subcategory":"Restaurants","address":"1730 S. Germantown Rd., Ste 113","phone":"(901) 381-6200"},{"id":"b529","name":"The Half Shell","category":"Restaurants & Food","subcategory":"Restaurants","address":"9091 Poplar Ave. #101","phone":"(901) 590-4304"},{"id":"b561","name":"Villa Castrioti Italian Restaurant","category":"Restaurants & Food","subcategory":"Restaurants","address":"714 N Germantown Pkwy #15","phone":"(901) 753-3894"},{"id":"b566","name":"Waffle & Pancake House - Cordova TN","category":"Restaurants & Food","subcategory":"Restaurants","address":"420 South Germantown Parkway Suite 112","phone":"(901) 779-7092"}]};

function showView(id) {
  document.querySelectorAll(".view").forEach(function(v){ v.classList.remove("active"); });
  document.getElementById(id).classList.add("active");
}
function goHome() { clearSearch(); showView("view-home"); renderHome(); }
function renderHome() {
  var grid = document.getElementById("categoryGrid");
  grid.innerHTML = "";
  DATA.categories.forEach(function(cat) {
    var count = DATA.businesses.filter(function(b){ return b.category === cat; }).length;
    var tile = document.createElement("div");
    tile.className = "catsign";
    tile.onclick = function() { openCategory(cat); };
    tile.innerHTML = '<div class="catname">' + escapeHtml(cat) + '</div><div class="catcount">' + count + " listing" + (count === 1 ? "" : "s") + "</div>";
    grid.appendChild(tile);
  });
}
function openCategory(cat) {
  document.getElementById("listTitle").textContent = cat;
  var items = DATA.businesses.filter(function(b){ return b.category === cat; }).sort(function(a,b){ return a.name.localeCompare(b.name); });
  renderAlphaList(items);
  showView("view-list");
}
function renderAlphaList(items) {
  var content = document.getElementById("listContent");
  content.innerHTML = "";
  if (items.length === 0) { content.innerHTML = '<div class="emptystate">No listings yet in this category.</div>'; return; }
  var lastLetter = "";
  items.forEach(function(biz) {
    var letter = biz.name[0].toUpperCase();
    if (letter !== lastLetter) {
      var head = document.createElement("div");
      head.className = "letterhead"; head.textContent = letter;
      content.appendChild(head); lastLetter = letter;
    }
    var row = document.createElement("div");
    row.className = "bizrow";
    row.onclick = function() { openDetail(biz); };
    row.innerHTML = '<div><div class="bizname">' + escapeHtml(biz.name) + '</div><div class="bizcat">' + escapeHtml(biz.subcategory || biz.category) + '</div></div><div class="bizarrow">&rsaquo;</div>';
    content.appendChild(row);
  });
}
function openDetail(biz) {
  var card = document.getElementById("detailCard");
  card.innerHTML = '<div class="detailname">' + escapeHtml(biz.name) + '</div>' +
    '<div class="detailcat">' + escapeHtml(biz.subcategory || biz.category) + '</div>' +
    (biz.address ? ('<div class="detailrow" style="border-top:none;"><span class="detaillabel">Address</span><span>' + escapeHtml(biz.address) + '</span></div>') : '<div class="detailrow" style="border-top:none;color:var(--ink-soft);">No address on file</div>') +
    (biz.phone ? ('<div class="detailrow"><span class="detaillabel">Phone</span><span>' + escapeHtml(biz.phone) + '</span></div>') : '') +
    '<button class="closebtn" onclick="closeDetail()">Close</button>';
  document.getElementById("detailOverlay").classList.add("active");
}
function closeDetail() { document.getElementById("detailOverlay").classList.remove("active"); }
function doSearch(query) {
  var q = query.trim().toLowerCase();
  document.getElementById("clearBtn").style.display = q ? "flex" : "none";
  if (!q) { goHome(); return; }
  document.getElementById("listTitle").textContent = "Search results";
  var items = DATA.businesses.filter(function(b){
    return b.name.toLowerCase().indexOf(q) !== -1 || b.category.toLowerCase().indexOf(q) !== -1 || (b.subcategory||"").toLowerCase().indexOf(q) !== -1;
  }).sort(function(a,b){ return a.name.localeCompare(b.name); });
  renderAlphaList(items);
  showView("view-list");
}
function clearSearch() { document.getElementById("searchInput").value = ""; }
var kbRows = ["1234567890","qwertyuiop","asdfghjkl","zxcvbnm"];
(function buildKeyboard() {
  kbRows.forEach(function(row, i) {
    var el = document.getElementById("kbrow" + (i+1));
    el.innerHTML = row.split("").map(function(ch) { return '<button class="kbkey" onclick="kbType(&quot;' + ch + '&quot;)">' + ch + "</button>"; }).join("");
  });
})();
var kbTargetInput = null;
function openKeyboard() { kbTargetInput = document.getElementById("searchInput"); document.getElementById("keyboard").classList.add("active"); }
function closeKeyboard() { document.getElementById("keyboard").classList.remove("active"); }
function kbType(ch) { if (!kbTargetInput) return; kbTargetInput.value += ch; doSearch(kbTargetInput.value); }
function kbBackspace() { if (!kbTargetInput) return; kbTargetInput.value = kbTargetInput.value.slice(0,-1); doSearch(kbTargetInput.value); }
function escapeHtml(str) { var d = document.createElement("div"); d.textContent = str == null ? "" : str; return d.innerHTML; }

renderHome();
</script>

</html>
